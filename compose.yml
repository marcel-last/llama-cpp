services:
  llama-cpp:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llama-cpp
    restart: unless-stopped
    ipc: host
    volumes:
      - ./models:/models
    ports:
      - "8080:8080"
    environment:
      - GGML_CUDA_GRAPH_OPT=${LLAMA_CUDA_GRAPH_OPT}
      - LLAMA_ARG_MODELS_PRESET=${LLAMA_MODELS_PRESET}
      - LLAMA_ARG_MODELS_MAX=${LLAMA_MODELS_MAX}
      - LLAMA_ARG_API_KEY=${LLAMA_API_KEY}
      - LLAMA_ARG_HOST=${LLAMA_API_HOST}
      - LLAMA_ARG_PORT=${LLAMA_API_PORT}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
