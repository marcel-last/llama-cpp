services:
  llama-cpp:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llama-cpp
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - GGML_CUDA_GRAPH_OPT=1
      - LLAMA_ARG_API_KEY=${LLAMA_API_KEY}
    volumes:
      - /srv/models:/models
    command: >
      --models-preset /models/models.ini
      --models-max 1
      --host 0.0.0.0
      --port 8080
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
